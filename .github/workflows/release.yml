name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected release version (e.g. 10.3.1). Must match the plugin manifest; omit to use the manifest value.'
        required: false
        type: string
      dry_run:
        description: 'Run validation only, do not commit, tag or push'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version from the manifests
        id: version
        run: |
          claude_version=$(python3 -c "import json;print(json.load(open('paseo-cto/.claude-plugin/plugin.json'))['version'])")
          codex_base=$(python3 -c "import json;print(json.load(open('paseo-cto/.codex-plugin/plugin.json'))['version'].split('+codex.')[0])")
          if [ "$claude_version" != "$codex_base" ]; then
            echo "manifest versions differ: Claude $claude_version, Codex $codex_base" >&2
            exit 1
          fi
          requested="${{ github.event.inputs.version }}"
          if [ -n "$requested" ] && [ "$requested" != "$claude_version" ]; then
            echo "requested $requested but the manifests carry $claude_version; bump the manifests first" >&2
            exit 1
          fi
          if ! printf '%s' "$claude_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid version format: $claude_version" >&2
            exit 1
          fi
          echo "version=$claude_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$claude_version" >> "$GITHUB_OUTPUT"
          echo "Release version: $claude_version"

      - name: Refuse an existing tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists; a published release tag is never moved" >&2
            exit 1
          fi

      - name: Contract tests
        run: |
          bash paseo-cto/scripts/test-plugin-contracts.sh
          bash paseo-cto/scripts/test-ledger.sh

      - name: Stamp work tooling
        run: python3 paseo-cto/scripts/stamp-work-tooling.py

      - name: Update the Codex cachebuster
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json, pathlib, sys, time
          version = sys.argv[1]
          path = pathlib.Path("paseo-cto/.codex-plugin/plugin.json")
          manifest = json.loads(path.read_text())
          stamp = time.strftime("%Y%m%d%H%M%S", time.gmtime())
          manifest["version"] = f"{version}+codex.{stamp}"
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(manifest["version"])
          PY

      - name: Distribution sync check
        run: bash paseo-cto/scripts/check-distribution-sync.sh

      - name: Commit, tag and push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add paseo-cto/.codex-plugin/plugin.json paseo-cto/skills/paseo-cto/templates
            git commit -m "chore: update codex cachebuster for $tag"
          fi
          git tag "$tag"
          git push origin HEAD:main
          git push origin "$tag"
          echo "Release $tag published"

      - name: Report a dry run
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Validation passed for ${{ steps.version.outputs.tag }}; nothing was committed, tagged or pushed"
