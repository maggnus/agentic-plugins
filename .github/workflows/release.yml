name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 10.2.0). If omitted, reads from plugin manifest.'
        required: false
        type: string
      dry_run:
        description: 'Run validation only, do not create tag or push'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Codex CLI
        run: |
          npm install -g @anthropic-ai/codex-cli
          codex --version

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            version=$(jq -r '.version' paseo-cto/.claude-plugin/plugin.json)
            echo "version=$version" >> $GITHUB_OUTPUT
          fi
          echo "Release version: ${version}"

      - name: Validate version format
        run: |
          if ! [[ "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Run contract tests
        run: bash paseo-cto/scripts/test-plugin-contracts.sh

      - name: Stamp work tooling
        run: python3 paseo-cto/scripts/stamp-work-tooling.py

      - name: Update Codex cachebuster
        run: |
          python3 -m pip install --quiet -e ~/.codex/skills/.system/plugin-creator 2>/dev/null || true
          python3 ~/.codex/skills/.system/plugin-creator/scripts/update_plugin_cachebuster.py paseo-cto

      - name: Validate plugin
        run: python3 ~/.codex/skills/.system/plugin-creator/scripts/validate_plugin.py paseo-cto

      - name: Check distribution sync
        run: bash paseo-cto/scripts/check-distribution-sync.sh

      - name: Commit cachebuster update
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add paseo-cto/.codex-plugin/plugin.json
            git commit -m "chore: update codex cachebuster for v${{ steps.version.outputs.version }}"
          fi

      - name: Create and push tag
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -d "$tag"
          fi
          git tag "$tag"
          git push origin main
          git push origin "$tag" --force

      - name: Report result
        run: |
          echo "Release v${{ steps.version.outputs.version }} completed successfully"
          echo "Tag: v${{ steps.version.outputs.version }}"